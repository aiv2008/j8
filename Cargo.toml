[package]
name = "j8"
description = "j8: V8 rewritten in Rust. The root package re-exports the binding macros #[j8::class] / #[j8::object] / #[j8::function] and, by feature, the executor, built-ins, platform, JIT and the other j8 crates"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false
repository.workspace = true
readme = "README.md"
# Publish only the library: the tests/test262 submodule has over fifty thousand files, too many for crates.io
include = ["/src", "/tests/binding.rs", "/tests/runtime.rs", "/tests/bindings_more.rs", "/tests/event_loop.rs", "/tests/terminate.rs", "/tests/jit_typeof.rs", "/tests/jit_lazy.rs", "/tests/jit_stack.rs", "/tests/regexp_fast.rs", "/tests/json_fast.rs", "/tests/jit_callbacks.rs", "/tests/jit_args.rs", "/tests/jit_intrinsics.rs", "/tests/jit_mod.rs", "/tests/jit_regexp.rs", "/tests/string_fast.rs", "/README.md", "/README.zh-CN.md", "/EMBEDDING.md", "/LICENSE"]

[lib]
name = "j8"
path = "src/lib.rs"

[dependencies]
j8framework.workspace = true
j8binding.workspace = true
j8macros.workspace = true
j8bytecode = { workspace = true, optional = true }
j8executor = { workspace = true, optional = true }
j8builtins = { workspace = true, optional = true }
j8platform = { workspace = true, optional = true }
j8taskqueue = { workspace = true, optional = true }
# Always used (the runtime's async queue); the `lockfree` feature only re-exports it
j8lockfree.workspace = true
j8compiler = { workspace = true, optional = true }
j8jit = { workspace = true, optional = true }
j8napi = { workspace = true, optional = true }

# The root package re-exports by feature; every sub-crate is also published on crates.io and can be depended on directly
[features]
default = ["runtime"]
# Everything to run JS: executor + built-ins + standard platform
runtime = ["executor", "builtins", "platform"]
# j8::bytecode: the bytecode (V8 Ignition, tables generated from V8's headers), encoder / decoder
bytecode = ["dep:j8bytecode"]
# j8::compiler: JS ⇒ bytecode (oxc parses)
compiler = ["dep:j8compiler", "bytecode"]
# j8::executor: the bytecode executor, implements Engine
executor = ["dep:j8executor", "compiler"]
# j8::builtins: built-in objects (the Intrinsics implementation)
builtins = ["dep:j8builtins"]
# j8::platform: the standard-library Platform
platform = ["dep:j8platform"]
# j8::taskqueue: lock-free dataflow task queue
taskqueue = ["dep:j8taskqueue"]
# j8::lockfree: lock-free building blocks
lockfree = []
# j8::jit: the speculative JIT, bytecode ⇒ machine code (x86-64 Unix and Windows, AArch64 Linux)
jit = ["executor", "dep:j8jit"]
# j8::Json<T>: Rust values crossing as JSON-shaped data through serde
json = ["j8binding/json"]
# j8::napi: Node-API (the C interface native addons link against)
napi = ["dep:j8napi"]
full = ["runtime", "taskqueue", "lockfree", "jit", "json", "napi"]
# Cross-process JS objects (Linux only): a paragc cross-heap as the old generation, objects shared by signature
crossheap = ["j8framework/crossheap"]

[dev-dependencies]
paragc.workspace = true
j8executor.workspace = true
j8builtins.workspace = true
j8platform.workspace = true
j8jit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# test262 conformance (`harness = false`): `cargo test --release --test test262`
[[test]]
name = "test262"
path = "tests/test262.rs"
harness = false

[[test]]
name = "binding"
path = "tests/binding.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"

[[test]]
name = "bindings_more"
path = "tests/bindings_more.rs"

[[test]]
name = "event_loop"
path = "tests/event_loop.rs"

[[test]]
name = "terminate"
path = "tests/terminate.rs"

[[test]]
name = "crossheap"
path = "tests/crossheap.rs"
required-features = ["crossheap"]

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[test]]
name = "code_gc"
path = "tests/code_gc.rs"

[[test]]
name = "jit_typeof"
path = "tests/jit_typeof.rs"

[[test]]
name = "jit_lazy"
path = "tests/jit_lazy.rs"

[[test]]
name = "jit_stack"
path = "tests/jit_stack.rs"

[[test]]
name = "regexp_fast"
path = "tests/regexp_fast.rs"

[[test]]
name = "json_fast"
path = "tests/json_fast.rs"

[[test]]
name = "jit_callbacks"
path = "tests/jit_callbacks.rs"

[[test]]
name = "jit_args"
path = "tests/jit_args.rs"

[[test]]
name = "jit_intrinsics"
path = "tests/jit_intrinsics.rs"

[[test]]
name = "jit_regexp"
path = "tests/jit_regexp.rs"

[[test]]
name = "string_fast"
path = "tests/string_fast.rs"


[[test]]
name = "jit_mod"
path = "tests/jit_mod.rs"

[[test]]
name = "param_tdz"
path = "tests/param_tdz.rs"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/j8"

[workspace.dependencies]
j8framework = { version = "0.5.1", path = "crates/j8framework" }
j8platform = { version = "0.5.1", path = "crates/j8platform" }
j8builtins = { version = "0.5.1", path = "crates/j8builtins" }
j8bytecode = { version = "0.5.1", path = "crates/j8bytecode" }
j8executor = { version = "0.5.1", path = "crates/j8executor" }
j8compiler = { version = "0.5.1", path = "crates/j8compiler" }
j8jit = { version = "0.5.1", path = "crates/j8jit" }
mlirpass = { version = "0.13.4", default-features = false, features = ["std", "dialect.llvm"] }
libc = "0.2"
region = "3"
clear-cache = "0.1"
dunce = "1"
j8macros = { version = "0.5.1", path = "crates/macros" }
j8binding = { version = "0.5.1", path = "crates/j8binding" }
j8napi = { version = "0.5.1", path = "crates/j8napi" }
j8 = { version = "0.5.1", path = "." }
moremath = { version = "=0.2.3", default-features = false }
libm = "0.2"
paragc = "0.7.0"
j8lockfree = { version = "0.5.1", path = "crates/j8lockfree" }
j8taskqueue = { version = "0.5.1", path = "crates/j8taskqueue" }
hashbrown = { version = "0.17", default-features = false }
rustc-hash = { version = "2", default-features = false }
ryu-js = { version = "1", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
regress = { version = "0.12", default-features = false, features = ["alloc", "utf16"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_str = "0.158"
oxc_semantic = "0.158"
oxc_syntax = "0.158"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Source files carry no comments: safety contracts are documented in the guides
missing_safety_doc = "allow"
must_use_candidate = "allow"
# JS numeric semantics are exact comparisons by definition
float_cmp = "allow"
# Short names like a / f / x / y are conventional in built-in functions
many_single_char_names = "allow"
# Paired names like args / argc are conventional
similar_names = "allow"
# When both branches have bodies, match reads better than if let ... else
single_match_else = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[package]
name = "benchv8"
description = "Timing comparison of the same JS benchmarks on j8 and V8 (rusty_v8, with JIT / --jitless)"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
readme = "README.md"

# A sample is a package of its own, built against the published j8 (not part of the j8 workspace)
[workspace]

[dependencies]
v8 = "=152.2.0"
j8 = { version = "0.5.1", features = ["jit"] }

[profile.release]
debug = false
